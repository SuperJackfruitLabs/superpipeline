name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.select.outputs.app }}
      docs: ${{ steps.select.outputs.docs }}
      landing: ${{ steps.select.outputs.landing }}
      full: ${{ steps.select.outputs.full }}
      extended: ${{ steps.select.outputs.extended }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/ci-plan.test.mjs
      - id: select
        run: node scripts/ci-plan.mjs
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT: ${{ github.event_name }}

  unit:
    needs: plan
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm ci:test
      - run: node apps/web/scripts/pixel/check-lock-change.mjs "$CI_BASE"
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}


  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci && npm run build
        working-directory: docs-site
      - run: pnpm --filter @superpipeline/docs-check test
      - run: tar -czf docs.tgz -C docs-site/dist .
      - uses: actions/upload-artifact@v4
        if: success() && github.server_url == 'https://github.com'
        with:
          name: docs-${{ github.sha }}
          path: docs.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        if: success() && github.server_url != 'https://github.com'
        with:
          name: docs-${{ github.sha }}
          path: docs.tgz
          if-no-files-found: error
          retention-days: 14


  landing:
    needs: plan
    if: needs.plan.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: landing
      - run: tar -czf landing.tgz -C landing/dist .
      - uses: actions/upload-artifact@v4
        if: success() && github.server_url == 'https://github.com'
        with:
          name: landing-${{ github.sha }}
          path: landing.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        if: success() && github.server_url != 'https://github.com'
        with:
          name: landing-${{ github.sha }}
          path: landing.tgz
          if-no-files-found: error
          retention-days: 14


  test:
    needs: [plan, unit, docs, landing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci-plan.mjs gate test
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

  build:
    needs: plan
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:build-app
      - run: pnpm ci:verify-app
      - run: tar -czf app.tgz -C .ci app
      - uses: actions/upload-artifact@v4
        if: success() && github.server_url == 'https://github.com'
        with:
          name: app-${{ github.sha }}
          path: app.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        if: success() && github.server_url != 'https://github.com'
        with:
          name: app-${{ github.sha }}
          path: app.tgz
          if-no-files-found: error
          retention-days: 14


  smoke:
    needs: [plan, build]
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash apps/web/scripts/pixel/image-guard.sh v1.61.0-jammy
      - uses: actions/download-artifact@v4
        if: success() && github.server_url == 'https://github.com'
        with:
          name: app-${{ github.sha }}
          path: .ci-download
      - uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        if: success() && github.server_url != 'https://github.com'
        with:
          name: app-${{ github.sha }}
          path: .ci-download
      - run: mkdir -p .ci && tar -xzf .ci-download/app.tgz -C .ci && pnpm ci:verify-app
      - run: pnpm --filter @superpipeline/web e2e -- --project=smoke --workers=1
        env:
          SP_E2E_PREBUILT: '1'
          SP_E2E_PROJECT: smoke
          SP_E2E_SHARD: '1/1'
          SP_E2E_REPORT: ${{ github.workspace }}/.ci/reports/result.json
      - run: node scripts/e2e-report.mjs --input .ci/reports/result.json --output .ci/reports/summary.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always() && github.server_url == 'https://github.com'
        with:
          name: smoke-report
          path: .ci/reports
          if-no-files-found: error
          retention-days: 14
      - uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        if: always() && github.server_url != 'https://github.com'
        with:
          name: smoke-report
          path: .ci/reports
          if-no-files-found: error
          retention-days: 14


  browser:
    needs: [plan, build]
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash apps/web/scripts/pixel/image-guard.sh v1.61.0-jammy
      - uses: actions/download-artifact@v4
        if: success() && github.server_url == 'https://github.com'
        with:
          name: app-${{ github.sha }}
          path: .ci-download
      - uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        if: success() && github.server_url != 'https://github.com'
        with:
          name: app-${{ github.sha }}
          path: .ci-download
      - run: mkdir -p .ci && tar -xzf .ci-download/app.tgz -C .ci && pnpm ci:verify-app
      - run: pnpm --filter @superpipeline/web e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }} --workers=1
        env:
          SP_E2E_PREBUILT: '1'
          SP_E2E_PROJECT: ${{ matrix.project }}
          SP_E2E_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          SP_E2E_REPORT: ${{ github.workspace }}/.ci/reports/result.json
      - run: node scripts/e2e-report.mjs --input .ci/reports/result.json --output .ci/reports/summary.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always() && github.server_url == 'https://github.com'
        with:
          name: browser-${{ matrix.project }}-${{ matrix.shard }}
          path: .ci/reports
          if-no-files-found: error
          retention-days: 14
      - uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        if: always() && github.server_url != 'https://github.com'
        with:
          name: browser-${{ matrix.project }}-${{ matrix.shard }}
          path: .ci/reports
          if-no-files-found: error
          retention-days: 14


  e2e:
    needs: [plan, build, smoke, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci-plan.mjs gate e2e
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.app == 'true' && github.server_url == 'https://github.com'
        with:
          name: browser-critical-1
          path: .ci/shards/critical-1
      - uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        if: needs.plan.outputs.app == 'true' && github.server_url != 'https://github.com'
        with:
          name: browser-critical-1
          path: .ci/shards/critical-1
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.app == 'true' && github.server_url == 'https://github.com'
        with:
          name: browser-critical-2
          path: .ci/shards/critical-2
      - uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        if: needs.plan.outputs.app == 'true' && github.server_url != 'https://github.com'
        with:
          name: browser-critical-2
          path: .ci/shards/critical-2
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.extended == 'true' && github.server_url == 'https://github.com'
        with:
          name: browser-extended-1
          path: .ci/shards/extended-1
      - uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        if: needs.plan.outputs.extended == 'true' && github.server_url != 'https://github.com'
        with:
          name: browser-extended-1
          path: .ci/shards/extended-1
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.extended == 'true' && github.server_url == 'https://github.com'
        with:
          name: browser-extended-2
          path: .ci/shards/extended-2
      - uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        if: needs.plan.outputs.extended == 'true' && github.server_url != 'https://github.com'
        with:
          name: browser-extended-2
          path: .ci/shards/extended-2
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.extended == 'true' && github.server_url == 'https://github.com'
        with:
          name: browser-extended-3
          path: .ci/shards/extended-3
      - uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        if: needs.plan.outputs.extended == 'true' && github.server_url != 'https://github.com'
        with:
          name: browser-extended-3
          path: .ci/shards/extended-3
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.extended == 'true' && github.server_url == 'https://github.com'
        with:
          name: browser-extended-4
          path: .ci/shards/extended-4
      - uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        if: needs.plan.outputs.extended == 'true' && github.server_url != 'https://github.com'
        with:
          name: browser-extended-4
          path: .ci/shards/extended-4
      - run: node scripts/e2e-report.mjs --merge .ci/shards --expected "$EXPECTED" --output .ci/summary.json
        if: needs.plan.outputs.app == 'true'
        env:
          EXPECTED: ${{ needs.plan.outputs.extended == 'true' && '6' || '2' }}
          SP_E2E_MATRIX: ${{ needs.plan.outputs.matrix }}

  visual:
    needs: plan
    if: needs.plan.outputs.app == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The container runs as root over a checkout it did not create: git refuses to work in it otherwise.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - name: the image and the lockfile name the same Playwright
        run: bash apps/web/scripts/pixel/image-guard.sh v1.61.0-jammy
      # Both trees under the runner's temp dir, on the workspace's mount, so pnpm hardlinks from its store.
      - name: base versus head
        id: compare
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci
          bash apps/web/scripts/visual/base-vs-head.sh "$CI_BASE" 2>&1 | tee .ci/visual.log
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI: 'true'
          VISUAL_TMP: ${{ runner.temp }}
      # artifact v4 is GitHub only (forge: GHESNotSupportedError); on forge the job log carries each changed
      # screen's name, ratio and bounding box instead.
      - name: retain comparison outcome, including intentional no-capture result
        if: always()
        env:
          VISUAL_OUTCOME: ${{ steps.compare.outcome }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p apps/web/test-results/visual
          if test -f .ci/visual.log; then cp .ci/visual.log apps/web/test-results/visual/check.log; fi
          node -e 'require("node:fs").writeFileSync("apps/web/test-results/visual/outcome.json", JSON.stringify({source: process.env.SOURCE_COMMIT, outcome: process.env.VISUAL_OUTCOME}))'
      - uses: actions/upload-artifact@v4
        if: always() && github.server_url == 'https://github.com'
        with:
          name: visual-report
          path: apps/web/test-results/visual
          if-no-files-found: error
          retention-days: 14
      - uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        if: always() && github.server_url != 'https://github.com'
        with:
          name: visual-report
          path: apps/web/test-results/visual
          if-no-files-found: error
          retention-days: 14


  pixel:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    continue-on-error: true
    # Playwright's own image: Chromium and its system fonts are already in it (no per-run apt
    # install), and forge and GitHub render in the *same* userland. The tag must equal the locked
    # @playwright/test version; the guard step below fails loudly if it does not.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the image and the lockfile name the same Playwright
        run: bash apps/web/scripts/pixel/image-guard.sh v1.61.0-jammy
      # References and app render in the same Chromium, with the same font files, in the same run.
      - run: mkdir -p apps/web/test-results/pixel-parts && pnpm --filter @superpipeline/web test:pixel
        env:
          PIXEL_PARTS: '1'
          PIXEL_PARTS_DIR: ${{ github.workspace }}/apps/web/test-results/pixel-parts
      - name: drift summary
        if: always()
        run: node apps/web/scripts/pixel/drift-summary.mjs apps/web/test-results/pixel/results.json
      - uses: actions/upload-artifact@v4
        if: always() && github.server_url == 'https://github.com'
        with:
          name: pixel-report
          path: apps/web/test-results/pixel*
          if-no-files-found: error
          retention-days: 14
      - uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        if: always() && github.server_url != 'https://github.com'
        with:
          name: pixel-report
          path: apps/web/test-results/pixel*
          if-no-files-found: error
          retention-days: 14


  deploy:
    needs: [plan, test, e2e, visual]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://app.superpipeline.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: success() && github.server_url == 'https://github.com'
        with:
          name: app-${{ github.sha }}
          path: .ci-download
      - uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        if: success() && github.server_url != 'https://github.com'
        with:
          name: app-${{ github.sha }}
          path: .ci-download
      - run: mkdir -p .ci && tar -xzf .ci-download/app.tgz -C .ci
      - run: pnpm ci:verify-app
      - run: pnpm ci:deploy-app


  deploy-docs:
    needs: [plan, test, docs]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    environment:
      name: docs
      url: https://docs.superpipeline.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: success() && github.server_url == 'https://github.com'
        with:
          name: docs-${{ github.sha }}
          path: .ci-download
      - uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        if: success() && github.server_url != 'https://github.com'
        with:
          name: docs-${{ github.sha }}
          path: .ci-download
      - run: mkdir -p docs-site/dist && tar -xzf .ci-download/docs.tgz -C docs-site/dist
      - name: Deploy verified site build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler-cwd"
          cd "$RUNNER_TEMP/wrangler-cwd"
          npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/docs-site/dist" --project-name=superpipeline-docs --branch=main


  deploy-landing:
    needs: [plan, test, landing]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.plan.outputs.landing == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-landing
      cancel-in-progress: false
    environment:
      name: landing
      url: https://superpipeline.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: success() && github.server_url == 'https://github.com'
        with:
          name: landing-${{ github.sha }}
          path: .ci-download
      - uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        if: success() && github.server_url != 'https://github.com'
        with:
          name: landing-${{ github.sha }}
          path: .ci-download
      - run: mkdir -p landing/dist && tar -xzf .ci-download/landing.tgz -C landing/dist
      - name: Deploy verified site build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler-cwd"
          cd "$RUNNER_TEMP/wrangler-cwd"
          npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/landing/dist" --project-name=superpipeline-site --branch=main
