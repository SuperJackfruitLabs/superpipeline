name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # `supi` runs under bun — `packages/cli/src/index.ts` is executed directly via a
      # `#!/usr/bin/env bun` shebang, not built first. Its installer refuses to install
      # without bun on PATH, so without this step four of its tests fail on the refusal
      # rather than on anything they are testing.
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: references change only on purpose
        run: node apps/web/scripts/pixel/check-lock-change.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @superpipeline/web exec playwright install --with-deps chromium
      # Boots wrangler dev (:8787) + the SvelteKit dev server (:5173) via Playwright's webServer.
      - run: pnpm --filter @superpipeline/web e2e
      # The report upload uses artifact v4, which forge's runner does not support (GHESNotSupportedError);
      # on forge the step is skipped, like the deploy jobs below.
      - uses: actions/upload-artifact@v4
        if: always() && github.server_url == 'https://github.com'
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  pixel:
    # No `needs: [test]`: the screens do not depend on the unit tests, and deploy already waits for
    # all three, so waiting only added the unit tests' ~10 minutes to every verdict.
    runs-on: ubuntu-22.04
    # Playwright's own image: Chromium and its system fonts are already in it (no per-run apt
    # install), and forge and GitHub render in the *same* userland. GitHub's 24.04 and forge's
    # act-22.04 had drawn dialogs and cards 1-4% apart. The tag must equal the locked
    # @playwright/test version; the guard step below fails loudly if it does not.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the image and the lockfile name the same Playwright
        run: |
          have="$(pnpm --filter @superpipeline/web exec playwright --version | awk '{print $2}')"
          want="${PIXEL_IMAGE_TAG#v}"; want="${want%%-*}"
          echo "playwright $have, image $want"
          test "$have" = "$want" || { echo "::error::bump the pixel job's image to v$have-jammy"; exit 1; }
        env:
          PIXEL_IMAGE_TAG: v1.61.0-jammy
      # References and app render in the same Chromium, with the same font files, in the same run:
      # no stored screenshots, so platform rasterisation cancels out (fixtures-and-harness.md §B.8).
      - run: mkdir -p apps/web/test-results/pixel-parts && pnpm --filter @superpipeline/web test:pixel
        env:
          PIXEL_PARTS: '1'
          PIXEL_PARTS_DIR: ${{ github.workspace }}/apps/web/test-results/pixel-parts
      - uses: actions/upload-artifact@v4
        if: always() && github.server_url == 'https://github.com'
        with:
          name: pixel-report
          path: |
            apps/web/test-results/pixel
            apps/web/test-results/pixel-parts
          retention-days: 14

  # Every deploy job below is gated on `github.server_url == 'https://github.com'`. This workflow
  # also runs on forge (Forgejo Actions reads .github/workflows when .forgejo/workflows is absent),
  # where `github.server_url` is forge's own URL. Once forge is primary, a push to forge's main
  # reaches GitHub's main through the push mirror, and THAT push is what deploys. forge holds no
  # CLOUDFLARE_API_TOKEN and never should: on forge these jobs are skipped, not failed.
  #
  # Continuous deploy: after tests pass on a push to main, migrate the remote D1 + ship to Cloudflare.
  # Needs a CLOUDFLARE_API_TOKEN repo secret (Workers Scripts: Edit · D1: Edit, scoped to your account).
  deploy:
    needs: [test, e2e, pixel]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://app.superpipeline.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Apply any new catalog migrations to the remote D1 (idempotent), then build the web + deploy
      # the Worker with real auth (DEV_AUTH off).
      - run: pnpm --filter @superpipeline/api db:migrate
      - run: pnpm --filter @superpipeline/api run deploy

  # The published documentation site, to Cloudflare Pages at docs.superpipeline.dev.
  #
  # Separate from `deploy` on purpose. The docs site shares no dependency tree with the
  # Worker — it is npm, at the repo root, outside the pnpm workspace, for reasons set out
  # in docs-site/README.md — and a docs typo should not be able to hold up a Worker deploy
  # or vice versa.
  #
  # Gated on `test` only, not on `e2e`: the docs site is a static build with no runtime to
  # exercise, and its claims are checked by packages/docs-check inside `test`.
  #
  # Needs the same CLOUDFLARE_API_TOKEN secret, with Pages: Edit added to its scope, and a
  # Pages project named `superpipeline-docs`. See docs-site/README.md for the one-time setup.
  deploy-docs:
    needs: [test]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    environment:
      name: docs
      url: https://docs.superpipeline.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm, not pnpm, and scoped to docs-site: this project is deliberately not a
      # workspace member.
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      # wrangler invoked directly rather than through cloudflare/wrangler-action.
      # The action picks a package manager by looking at the REPO ROOT, finds
      # pnpm-lock.yaml, and shells out to pnpm to install wrangler — which this job
      # does not have, because docs-site is deliberately npm. That failed with
      # "Unable to locate executable file: pnpm", before it ever reached Cloudflare.
      #
      # npx from docs-site uses the npm already set up above. wrangler is pinned to
      # the major apps/api uses, so the two cannot drift into different CLIs.
      # Run from a scratch directory, NOT from docs-site and NOT from the repo root.
      # Both were tried against the live account and both are wrong:
      #
      #   - in docs-site, wrangler's project detection SCAFFOLDS the project — it
      #     added an @astrojs/cloudflare adapter and a wrangler devDependency, wrote
      #     wrangler.jsonc, and rewrote astro.config.mjs and tsconfig.json. The Astro
      #     build then failed on the Cloudflare vite plugin it had just installed.
      #   - at the repo root it refuses outright: "application detection logic has
      #     been run in the root of a workspace".
      #
      # From a neutral cwd with an absolute path it is clean, and leaves the checkout
      # untouched. Verified by deploying both sites this way.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler-cwd"
          cd "$RUNNER_TEMP/wrangler-cwd"
          npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/docs-site/dist" \
            --project-name=superpipeline-docs --branch=main

  # The public page, to Cloudflare Pages at superpipeline.dev.
  #
  # Until this job existed the page was deployed by hand, and it went stale the same
  # day: the CLI was renamed to `supi` on main while superpipeline.dev went on telling
  # visitors about `kbn`. A page nothing redeploys drifts silently, because nothing
  # fails.
  #
  # Shaped exactly like deploy-docs, for the same reasons: landing/ is npm and outside
  # the pnpm workspace (see the comment at the top of landing/src/pages/index.astro), and
  # wrangler must run from a neutral cwd. Same secret; the Pages project is
  # `superpipeline-site`.
  deploy-landing:
    needs: [test]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-landing
      cancel-in-progress: false
    environment:
      name: landing
      url: https://superpipeline.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: landing
      - run: npm run build
        working-directory: landing
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler-cwd"
          cd "$RUNNER_TEMP/wrangler-cwd"
          npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/landing/dist" \
            --project-name=superpipeline-site --branch=main
