name: Release supi

# A `v*` tag does two independent things: `release` publishes the supi CLI binaries, and
# `deploy-production` ships the app (apps/api + apps/web) to app.superpipeline.dev. Main deploys to
# staging only (ci.yml). Neither job needs the other, so a failed CLI build never blocks the app and
# vice versa. The app deploy refuses a tag whose commit is not on main.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.2)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish supi
    # GitHub only. The release is published with `gh` and GitHub's token; on forge (which runs this
    # workflow too, from .github/workflows) the tag reaches GitHub through the push mirror and the
    # release is built there.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest

    # One job builds every target, where agentpod's equivalent needs a matrix: `bun build
    # --compile` cross-compiles from a single runner, while Go needs a GOOS/GOARCH pair per build.
    # That difference removes the failure this repo would otherwise inherit — agentpod's release
    # workflow carries `fail-fast: false` because one arch's transient runner failure once
    # cancelled the others and published an incomplete v0.1.7. Four targets in one job cannot
    # produce a partial release: either the job publishes all of them or it publishes none.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A release must not be the first place a break is noticed. The same checks CI runs on a PR
      # run again here, against the exact commit being published.
      - name: Typecheck and test the CLI
        run: |
          pnpm --filter @superpipeline/cli typecheck
          pnpm --filter @superpipeline/cli test

      - name: Resolve the tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build every published target
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # darwin and linux only, matching agentpod's matrix and `assetName()` in update.ts.
          # Adding a target here without adding it there gives a binary nothing will ever fetch.
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build \
              --compile \
              --minify \
              --define SUPI_VERSION="\"${TAG}\"" \
              --target="bun-${target}" \
              packages/cli/src/index.ts \
              --outfile "dist/supi-${target}"
          done
          ls -lh dist/

      # Proves the artifact that will be published actually runs, and reports the tag it was built
      # as. A binary whose --define silently failed would otherwise ship reporting `dev` and never
      # consider itself out of date again.
      - name: Verify the linux-x64 binary reports its version
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          got="$(./dist/supi-linux-x64 version)"
          echo "$got"
          case "$got" in
            "supi ${TAG} "*) ;;
            *) echo "::error::binary reports '${got}', expected version ${TAG}"; exit 1 ;;
          esac

      # The skill asset is printed by the binary it documents, so it cannot differ from what
      # `supi skill` prints. Older installers still fetch it by name.
      - name: Generate the skill asset from the binary
        run: ./dist/supi-linux-x64 skill > dist/SKILL.md

      - name: Checksums
        working-directory: dist
        run: sha256sum supi-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          # `--generate-notes` on create; an existing release is filled in rather than recreated so
          # a re-run after a failed upload does not discard notes someone already edited.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          # The skill ships with the binaries it documents. `install.sh` fetches it by tag, so a
          # station always gets the skill that matches its supi rather than whatever is on main. Current
          # installers run `supi skill install` instead; this asset is for older ones.
          gh release upload "$TAG" dist/supi-* dist/SHA256SUMS scripts/install.sh dist/SKILL.md --clobber

  deploy-production:
    name: Deploy the app to production
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://app.superpipeline.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # Production only ships commits that went through main.
      - name: Refuse a tag that is not on main
        id: commit
        run: |
          set -euo pipefail
          git fetch -q origin main
          sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; not deploying production"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The gate the operator chose (2026-10-13): production waits on test, e2e and visual, never on
      # pixel. The tag does not re-run them; it requires main's own CI run for this commit to have
      # passed them, and deploys the artifact that run built and verified.
      - name: Require main's CI to have passed test, e2e and visual
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail() { echo "::error::main's CI for $SHA has not passed test/e2e/visual ($1)"; exit 1; }
          for run in $(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$SHA&per_page=20" \
              --jq '.workflow_runs[] | select(.head_sha == env.SHA) | .id'); do
            ok="$(gh api "repos/$REPO/actions/runs/$run/jobs?filter=latest&per_page=100" \
              --jq '[.jobs[] | select((.name == "test" or .name == "e2e" or .name == "visual") and .conclusion == "success") | .name] | unique | length')"
            if [ "$ok" = 3 ]; then
              echo "CI run $run passed test, e2e and visual"
              echo "run_id=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          fail "no push run of ci.yml on main for this commit has all three jobs green"

      - name: Download the artifact main's CI built
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: app-${{ steps.commit.outputs.sha }}
          path: .ci-download
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Refuse to rebuild a missing artifact
        if: steps.download.outcome != 'success'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          RUN: ${{ steps.ci.outputs.run_id }}
        run: |
          echo "::error::artifact app-$SHA from CI run $RUN is missing (artifacts expire after 14 days). Re-run main's CI for $SHA, then re-run this deploy."
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .ci && tar -xzf .ci-download/app.tgz -C .ci
      - run: pnpm ci:verify-app
      # scripts/app-artifact.mjs deploy applies the remote D1 migrations, then `wrangler deploy`.
      - run: pnpm ci:deploy-app

      - name: Smoke production
        env:
          ACCOUNTS: https://accounts.superjackfruit.com
        run: |
          set -eu
          for _ in 1 2 3 4 5 6; do
            sh deploy/staging/smoke.sh https://app.superpipeline.dev && exit 0
            sleep 10
          done
          exit 1
