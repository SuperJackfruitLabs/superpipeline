packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  # Optional native deps pulled transitively by the `agents` SDK; unused in the Workers runtime.
  '@mongodb-js/zstd': false
  core-js-pure: false
  node-liblzma: false
  esbuild: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - '@superjackfruitlabs/treaty-ecosystem-identity@0.0.2'
  - '@superjackfruitlabs/treaty-event-schemas@0.0.4'
