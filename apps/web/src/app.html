<!doctype html>
<html lang="en" data-product="superpipeline">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: the page owns the whole screen, notch and home indicator included, and
         keeps its content clear of them with env(safe-area-inset-*) (app.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- First frame: the person's vibe and theme, before any stylesheet (vibekit HEAD_SCRIPT).
         The first line carries a light/dark choice made with the old toggle into the cookie, once.
         head-script.test.ts fails if the HEAD_SCRIPT copy drifts from the installed vibekit. -->
    <script>(function(){try{if(!/(?:^|; )vk_appearance=/.test(document.cookie)){var t=localStorage.getItem('superpipeline.theme');if(t==='light'||t==='dark'){document.cookie='vk_appearance=daylight.'+t+'.strong.0; Path=/; Max-Age=31536000; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'');}}}catch(_){}})();</script>
    <script>(function(){try{var d=document,m=/(?:^|; )vk_appearance=([^;]*)/.exec(d.cookie||""),p=(m?m[1]:"").split("."),V=["daylight","paper","studio","quiet"],v=V.indexOf(p[0])>-1?p[0]:"daylight",t=["sun","light","dark"].indexOf(p[1])>-1?p[1]:"sun",s=["strong","subtle","off"].indexOf(p[2])>-1?p[2]:(v==="quiet"?"off":"strong"),n=new Date(),x=n.getHours()*60+n.getMinutes(),h=x<330||x>=1140?"night":x<420?"dawn":x>=1065?"dusk":x>=990?"golden":x<648?"morning":"noon",e=d.documentElement,r=e.getAttribute("data-product"),c="product";(p[4]||"").split("~").forEach(function(y){y=y.split(":");if(y.length===2&&y[0]===r&&"gold moss jade teal azure cobalt violet plum".split(" ").indexOf(y[1])>-1)c=y[1]});e.setAttribute("data-vibe",v);e.setAttribute("data-theme",t==="sun"?(h==="night"?"dark":"light"):t);e.setAttribute("data-phase",h);e.setAttribute("data-time",s);e.setAttribute("data-accent",c)}catch(_){}})();</script>
    <!-- Installable to a home screen. No service worker: nothing is cached offline, because a
         stale app shell would fight the sign-in. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#17162a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fff8ee" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Translucent: the installed app draws under the status bar, which is why the frame pads by
         safe-area-inset-top. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Superpipeline" />
    <title>superpipeline</title>
    <!-- The translucent-v2 favicon set (static/brand/README.md). The SVG plate follows the OS light/dark
         setting; browsers that cannot use it fall back to the ICO and PNGs. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
